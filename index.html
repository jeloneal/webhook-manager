<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Webhook Manager</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div class="container">
        <!-- Login Screen -->
        <div id="loginScreen">
            <h1>🔐 Webhook Manager</h1>
            <p class="subtitle">Sichere Verwaltung deiner Webhooks</p>
            <div id="loginAlert"></div>
            <form class="login-form" id="loginForm">
                <input type="text" class="visually-hidden" name="username" value="admin" autocomplete="username" tabindex="-1" aria-hidden="true">
                <input type="password" id="passwordInput" autocomplete="current-password" placeholder="Passwort eingeben" required>
                <button type="submit">Login</button>
            </form>
        </div>

        <!-- Main Screen -->
        <div id="mainScreen" class="hidden">
            <div class="header-bar">
                <div>
                    <h1>⚡ Webhook Manager</h1>
                    <p class="subtitle">Webhooks verwalten und auslösen</p>
                </div>
                <div class="header-actions">
                    <button id="createButton">+ Neu anlegen</button>
                    <button class="btn-secondary" id="logoutButton">Logout</button>
                </div>
            </div>
            
            <div id="mainAlert"></div>
            
            <div id="webhookList">
                <div class="loading">Lade Webhooks...</div>
            </div>
        </div>
    </div>

    <!-- Create/Edit Modal -->
    <div id="webhookModal" class="modal">
        <div class="modal-content">
            <h2 id="modalTitle">Neuer Webhook</h2>
            <form id="webhookForm">
                <input type="hidden" id="webhookId">
                
                <div class="form-group">
                    <label>Name *</label>
                    <input type="text" id="webhookName" required>
                </div>
                
                <div class="form-group">
                    <label>URL *</label>
                    <input type="url" id="webhookUrl" required placeholder="https://...">
                </div>
                
                <div class="form-group">
                    <label>Methode</label>
                    <select id="webhookMethod">
                        <option value="POST">POST</option>
                        <option value="GET">GET</option>
                    </select>
                </div>
                
                <div class="form-group">
                    <label>Beschreibung</label>
                    <textarea id="webhookDescription" rows="3"></textarea>
                </div>
                
                <div class="form-actions">
                    <button type="submit">Speichern</button>
                    <button type="button" class="btn-secondary" id="cancelButton">Abbrechen</button>
                </div>
            </form>
        </div>
    </div>

    <script src="/static/app.js"></script>
</body>
</html>
