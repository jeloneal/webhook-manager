name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q
      - name: Bekannte Schwachstellen in den Abhängigkeiten prüfen
        run: pip-audit -r requirements.txt

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: docker build -t webhook-manager .
      - name: Container starten und Healthcheck prüfen
        run: |
          docker run -d --name wm -p 5000:5000 \
            -e WEBHOOK_PASSWORD=ci-test-password -e SECRET_KEY=ci-test-secret-key-0123456789 \
            -e COOKIE_SECURE=false webhook-manager
          for i in $(seq 1 20); do
            curl -fsS http://127.0.0.1:5000/healthz && exit 0
            sleep 1
          done
          docker logs wm
          exit 1
