version: '3.8'

services:
  webhook-manager:
    build: .
    container_name: webhook-manager
    restart: unless-stopped
    
    environment:
      # WICHTIG: Passwort ändern!
      # Eines von beiden setzen: Klartext-Passwort ODER Hash (python app.py --hash-password)
      - WEBHOOK_PASSWORD=${WEBHOOK_PASSWORD:-}
      - WEBHOOK_PASSWORD_HASH=${WEBHOOK_PASSWORD_HASH:-}
      - SECRET_KEY=${SECRET_KEY:?SECRET_KEY muss gesetzt sein}
      - DATABASE_PATH=/app/data/webhooks.db
      - PORT=5000
      # Hosts, die auch auf private Adressen zeigen dürfen (z.B. Portainer im LAN), kommagetrennt
      - ALLOWED_PRIVATE_HOSTS=${ALLOWED_PRIVATE_HOSTS:-}
      # Nur im Notfall: alle privaten Ziele erlauben (besser ALLOWED_PRIVATE_HOSTS)
      - ALLOW_PRIVATE_TARGETS=${ALLOW_PRIVATE_TARGETS:-false}
      # Anzahl vorgeschalteter Reverse-Proxys (Traefik = 1), damit das Login-Limit pro Client-IP gilt
      - TRUSTED_PROXIES=1
      - LOG_FORMAT=${LOG_FORMAT:-text}
    
    volumes:
      # Persistente Datenbank (Named Volume: Rechte für den non-root User passen automatisch)
      - webhook-data:/app/data
    
    networks:
      - traefik-net
    
    labels:
      # Traefik aktivieren
      - "traefik.enable=true"
      
      # Router für HTTPS
      - "traefik.http.routers.webhook-manager.rule=Host(`webhooks.example.com`)"
      - "traefik.http.routers.webhook-manager.entrypoints=websecure"
      - "traefik.http.routers.webhook-manager.tls.certresolver=letsencrypt"
      
      # Service
      - "traefik.http.services.webhook-manager.loadbalancer.server.port=5000"
      
      # Middleware für zusätzliche Sicherheit (optional)
      - "traefik.http.routers.webhook-manager.middlewares=webhook-manager-headers"
      - "traefik.http.middlewares.webhook-manager-headers.headers.framedeny=true"
      - "traefik.http.middlewares.webhook-manager-headers.headers.browserxssfilter=true"
      - "traefik.http.middlewares.webhook-manager-headers.headers.contentTypeNosniff=true"
      
      # Optional: Basic Auth zusätzlich zum Login
      # - "traefik.http.routers.webhook-manager.middlewares=webhook-auth"
      # - "traefik.http.middlewares.webhook-auth.basicauth.users=admin:$$apr1$$abc123$$"

networks:
  traefik-net:
    external: true

volumes:
  webhook-data:
